spring.datasource.url= ${MYOWNDB_URL}
spring.datasource.username= ${MYSPECIAL_USERNAME}
spring.datasource.password= ${MYDB_PASSWORD}
jwt.secret=${JWT_SECRET}



spring.application.name=room-swap-application

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



# Gmail SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Gmail account used to send the emails
spring.mail.username=${MAIL_USERNAME}

# Google App Password (NOT your normal Gmail password)
spring.mail.password=${SPRING_MAIL_PASSWORD}

# SMTP authentication and STARTTLS security
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

aws.s3.bucket-name=${MYVERYOWNAWS_BUCKET_NAME}
aws.s3.region=${THE_REGION_WHICH_I_CHOSE}